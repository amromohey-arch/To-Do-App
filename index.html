<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="618 Plan">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<title>618 Media - Action Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gate" class="gate" hidden>
  <form id="gateForm" class="gate-card">
    <p class="gate-eyebrow">618 Media</p>
    <h1 class="gate-title">Action Plan</h1>
    <p class="gate-copy">Enter the passphrase to continue.</p>
    <input id="gateInput" type="password" inputmode="text" autocomplete="off" placeholder="Passphrase" class="gate-input">
    <button type="submit" class="btn btn-primary gate-submit">Unlock</button>
    <p id="gateError" class="gate-error" hidden>Wrong passphrase. Try again.</p>
  </form>
</div>

<div id="app" class="app" hidden>

  <header class="topbar">
    <div class="brand">
      <p class="brand-eyebrow">618 Media</p>
      <h1 class="brand-title">Action Plan</h1>
    </div>
    <button id="menuBtn" class="icon-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="4" r="1.6" fill="currentColor"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/><circle cx="10" cy="16" r="1.6" fill="currentColor"/></svg>
    </button>
    <div id="menuPanel" class="menu-panel" hidden>
      <button class="menu-item" data-action="import">Import .txt</button>
      <button class="menu-item" data-action="export">Export .txt</button>
      <button class="menu-item menu-item-danger" data-action="reset">Reset all data</button>
    </div>
    <input id="importFile" type="file" accept=".txt,text/plain" hidden>
  </header>

  <div class="searchbar">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.4"/><path d="M11 11L14.5 14.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <input id="searchInput" type="text" placeholder="Search tasks, notes, or a name (try danny)" autocomplete="off">
    <button id="clearSearch" class="clear-search" hidden aria-label="Clear search">&times;</button>
  </div>

  <div class="chiprow" id="assigneeChips"></div>
  <div class="chiprow" id="categoryChips"></div>

  <label class="show-done-toggle">
    <input type="checkbox" id="showDoneToggle">
    <span>Show done</span>
  </label>

  <main id="list" class="list"></main>

  <p id="emptyState" class="empty-state" hidden>Nothing here. Add a task or clear your filters.</p>

  <button id="fab" class="fab" aria-label="Add task or note">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>

</div>

<div id="modalBackdrop" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-handle"></div>
    <h2 id="modalTitle" class="modal-title">Add task</h2>

    <label class="field-label" for="taskText">What needs doing</label>
    <textarea id="taskText" class="field-textarea" rows="3" placeholder="Type a task or a quick note. We'll guess where it goes."></textarea>

    <p id="suggestHint" class="suggest-hint" hidden></p>

    <div class="field-row">
      <div class="field-col">
        <label class="field-label" for="taskCategory">Category</label>
        <select id="taskCategory" class="field-select"></select>
        <input id="taskCategoryCustom" class="field-input" type="text" placeholder="New category name" hidden>
      </div>
      <div class="field-col">
        <label class="field-label" for="taskAssignee">Assigned to</label>
        <select id="taskAssignee" class="field-select"></select>
      </div>
    </div>

    <label class="field-label" for="taskNotes">Notes (optional)</label>
    <textarea id="taskNotes" class="field-textarea" rows="2" placeholder="Extra context"></textarea>

    <div class="modal-actions">
      <button id="deleteTaskBtn" class="btn btn-ghost btn-danger" hidden>Delete</button>
      <div class="modal-actions-right">
        <button id="cancelTaskBtn" class="btn btn-ghost">Cancel</button>
        <button id="saveTaskBtn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
